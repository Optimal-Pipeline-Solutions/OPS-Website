name: Golf Leaderboard Sync

on:
  schedule:
    - cron: '*/5 * * * *'   # backup in case self-trigger chain breaks
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check event switch (golf-config.json)
        id: gate
        run: |
          ENABLED=$(python3 -c "import json; print(str(json.load(open('golf-config.json')).get('enabled', False)).lower())" 2>/dev/null || echo "false")
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "Golf event enabled: $ENABLED"

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pip install requests

      - name: Sync Smartsheet data
        if: steps.gate.outputs.enabled == 'true'
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
        run: python scripts/sync_golf.py

      - name: Commit if changed
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add golf-data.json
          git diff --cached --quiet || git commit -m "Golf data sync [skip ci]"
          git push

      - name: Trigger next sync in 5 minutes
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sleep 270
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/golf-sync.yml/dispatches" \
            -d '{"ref":"main"}' \
          || echo "Self-trigger failed — schedule will handle next run"
